# Render Blueprint: New -> Blueprint -> pick this repo. Free plan: 512 MB RAM, 0.1 CPU,
# sleeps after 15 idle minutes (first request then takes about a minute).
# The image runs with STORAGE=off, so no database is needed.
services:
  - type: web
    name: billwise-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY      # secret: entered in the Render dashboard, never committed
        sync: false
      - key: FRONTEND_ORIGIN     # the Vercel URL, e.g. https://billwise.vercel.app (CORS)
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
